name: Build Android APK (on push)

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
    paths-ignore:
      - '**/*.md'
      - 'screenshots/**'
      - '.github/workflows/ios-*.yml'
  pull_request:
    branches:
      - 'main'
      - 'master'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build APK (arm64-v8a, release)
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: '17'
      FLUTTER_CHANNEL: 'stable'
      KEYSTORE_PATH: 'android/keystore/release.jks'
      KEY_PROPERTIES_PATH: 'android/key.properties'

    steps:
      - name: Checkout repository (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (cache wrapper + distributions)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
          cache-write-only: false
          validate-wrappers: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Print toolchain versions
        run: |
          echo "--- java ---"
          java -version
          echo "--- flutter ---"
          flutter --version
          echo "--- gradle wrapper properties ---"
          cat android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Network probe (JitPack / Google Maven / Maven Central)
        shell: bash
        run: |
          set +e
          echo "--- HTTPS probe ---"
          for pair in \
            "Google-Maven|https://dl.google.com/dl/android/maven2/index.html" \
            "Maven-Central|https://repo1.maven.org/maven2/" \
            "JitPack|https://jitpack.io/com/github/HChenX/SuperLyricApi/3.4/SuperLyricApi-3.4.pom"; do
            NAME="${pair%%|*}"
            URL="${pair#*|}"
            START_MS=$(date +%s%3N)
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -L "$URL" 2>&1)"
            END_MS=$(date +%s%3N)
            ELAPSED=$(( END_MS - START_MS ))
            if [[ "$CODE" =~ ^(200|301|302|304|401|403|404)$ ]]; then
              echo "  ✅ $NAME HTTP $CODE  (${ELAPSED} ms)  <$URL>"
            else
              echo "  ❌ $NAME HTTP $CODE (${ELAPSED} ms)  <$URL>"
              echo "     ⚠️  当前 GitHub Actions 构建机无法访问该仓库；依赖解析可能失败。"
              echo "     💡 若是 JitPack：可将仓库临时切换为镜像 (https://www.jitpack.io) 或在 workflow 里配置代理。"
            fi
          done
          echo "--- done ---"

      - name: Prepare release keystore (from GitHub Secrets)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 注意：GitHub Actions 禁止在 workflow if: 表达式里使用 secrets.*，
          # 所以把"secrets 是否已全部配置"的判断挪到 shell 内部进行。
          if [[ -z "${KEYSTORE_BASE64:-}" || -z "${KEYSTORE_PASSWORD:-}" \
             || -z "${KEY_ALIAS:-}"          || -z "${KEY_PASSWORD:-}" ]]; then
            echo "ℹ️ 未检测到完整的 release 签名 Secrets (KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD)"
            echo "   跳过 release keystore 注入，本次构建将使用 SDK 默认 debug 签名。"
            exit 0
          fi
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          cat > "$KEY_PROPERTIES_PATH" <<PROPS
          storeFile=keystore/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "✅ keystore decoded & key.properties written (release signing ENABLED)"

      - name: Build Flutter Android APK (release, arm64-v8a)
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="build/android-build.log"
          mkdir -p "$(dirname "$LOG_FILE")"

          BUILD_ARGS=(
            "apk" "--release"
            "--target-platform" "android-arm64"
            "--no-tree-shake-icons"
          )

          run_build() {
            # $1 = "first" or "retry"; $2 = extra flutter args (e.g. --refresh-dependencies)
            local round="$1"
            local extra="${2:-}"
            echo
            echo "============================================================================"
            echo "🚀 [$round] flutter build ${BUILD_ARGS[*]} $extra"
            echo "============================================================================"
            # - 用 tee 同时写 log + 控制台；pipefail 保证 flutter 失败时函数失败
            # - 第二轮用 >> 方式追加到 LOG_FILE
            set +e
            if [[ "$round" == "first" ]]; then
              flutter build "${BUILD_ARGS[@]}" $extra 2>&1 | tee "$LOG_FILE"
            else
              flutter build "${BUILD_ARGS[@]}" $extra 2>&1 | tee -a "$LOG_FILE"
            fi
            local rc=${PIPESTATUS[0]}
            set -e
            return $rc
          }

          JITPACK_KEYWORDS=("Could not resolve" "jitpack" "SuperLyricApi" "HChenX")
          log_matches_jitpack() {
            local lower
            lower="$(tr '[:upper:]' '[:lower:]' < "$LOG_FILE")"
            for kw in $(printf '%s\n' "${JITPACK_KEYWORDS[@]}" | tr '[:upper:]' '[:lower:]'); do
              if grep -qF -- "$kw" <<<"$lower"; then return 0; fi
            done
            return 1
          }

          set +e
          run_build "first"
          FIRST_RC=$?
          set -e

          if [[ $FIRST_RC -ne 0 ]]; then
            if log_matches_jitpack; then
              echo
              echo "⚠️ 第一轮构建失败，检测到 JitPack/SuperLyricApi 解析错误。"
              echo "   这通常是 JitPack 首次构建该版本（懒构建）需要 60~120 秒。"
              echo "   等待 90 秒后执行第二轮构建（--refresh-dependencies 强制刷新依赖缓存）…"
              sleep 90
              set +e
              run_build "retry(jitpack-wait)" "--refresh-dependencies"
              RETRY_RC=$?
              set -e
              if [[ $RETRY_RC -eq 0 ]]; then
                echo "✅ 第二轮构建成功，JitPack 已在等待期间构建完成 SuperLyricApi:3.4。"
              else
                echo "❌ 第二轮构建仍然失败。请检查 Network probe 与最终日志。"
                exit $RETRY_RC
              fi
            else
              echo "❌ 第一轮构建失败（非 JitPack/SuperLyricApi 类错误），直接失败退出。"
              exit $FIRST_RC
            fi
          else
            echo "✅ 第一轮构建成功。"
          fi

          echo
          echo "--- flutter-apk outputs ---"
          ls -lh build/app/outputs/flutter-apk/ 2>/dev/null || true
          echo "--- gradle apk outputs (fallback) ---"
          find android/app/build/outputs/apk -type f -name '*.apk' -printf '%p %s\n' 2>/dev/null || true
          echo "--- build log size ---"
          wc -l "$LOG_FILE" 2>/dev/null || true

      - name: Resolve APK artifact path
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK=""
          # 1) Prefer Flutter's canonical output directory
          for f in build/app/outputs/flutter-apk/app-release.apk \
                   build/app/outputs/flutter-apk/app-arm64-v8a-release.apk; do
            if [[ -f "$f" ]]; then APK="$f"; break; fi
          done
          # 2) Fallback to Gradle outputs (assemble* output)
          if [[ -z "$APK" ]]; then
            CANDIDATE="$(find android/app/build/outputs/apk -type f -name '*.apk' \
              | grep -i release | sort | tail -n 1)"
            [[ -n "$CANDIDATE" ]] && APK="$CANDIDATE"
          fi
          if [[ -z "$APK" ]]; then
            echo "❌ No APK produced. See build logs above." >&2
            exit 1
          fi
          SIZE="$(stat -c '%s' "$APK" 2>/dev/null || stat -f '%z' "$APK" 2>/dev/null)"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          echo "apk_path=$APK"            >> "$GITHUB_OUTPUT"
          echo "apk_size_bytes=$SIZE"    >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$SHA"         >> "$GITHUB_OUTPUT"
          NAME_BASE="kgka-music-android"
          REF="${GITHUB_REF_NAME//\//-}"
          SHA7="${GITHUB_SHA::7}"
          TS="$(date -u +%Y%m%d-%H%M%SZ)"
          # Signed or unsigned indicator
          if unzip -p "$APK" 'META-INF/*.RSA' >/dev/null 2>&1 || unzip -p "$APK" 'META-INF/*.DSA' >/dev/null 2>&1; then
            SUFFIX="signed"
          else
            SUFFIX="unsigned-debug"
          fi
          ARTIFACT_NAME="${NAME_BASE}-${REF}-${SHA7}-${TS}-${SUFFIX}"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "✅ resolved APK: $APK (${SIZE} bytes, sha256=${SHA:0:12}...)"
          echo "   artifact upload name: $ARTIFACT_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 45

      - name: Build summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ✅ Android APK 构建完成

          | 项 | 值 |
          |---|---|
          | 触发分支 / PR | \`${{ github.ref_name }}\` |
          | commit | \`${{ github.sha }}\` |
          | APK 文件 | \`${{ steps.apk.outputs.apk_path }}\` |
          | 大小 | ${{ steps.apk.outputs.apk_size_bytes }} 字节 |
          | SHA256 | \`${{ steps.apk.outputs.apk_sha256 }}\` |
          | 产物 Artifact 名 | \`${{ steps.apk.outputs.artifact_name }}\` |
          | 保留天数 | 45 天 |

          > 下载：点击本页上方 **Artifacts** 卡片（或 **Summary** 区）即可下载 \`${{ steps.apk.outputs.artifact_name }}.zip\`，解压后得到 APK。

          ### 签名说明
          - 若在仓库 **Settings → Secrets and variables → Actions** 中配置了 \`KEYSTORE_BASE64\` / \`KEYSTORE_PASSWORD\` / \`KEY_ALIAS\` / \`KEY_PASSWORD\` 四个 Secret，则本次构建使用正式 release 签名。
          - 否则使用 Android SDK 默认 debug 签名（文件名带 \`debug\` 后缀）。

          EOF

      - name: Upload build diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.ref_name }}-${{ github.sha }}
          path: |
            build/android-build.log
            android/build/outputs/**
            android/build/reports/**
            android/build/tmp/**
            android/.gradle/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Failure summary
        if: failure()
        run: |
          FAIL_HINT="(未获取到)"
          if [[ -f "build/android-build.log" ]]; then
            # 提取最后 80 行最关键的失败信息
            FAIL_HINT="$(tail -n 80 build/android-build.log | sed 's/\x1b\[[0-9;]*m//g' | awk 'NF' | tail -n 30)"
          fi
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"

          ## ❌ Android APK 构建失败

          ### 常见失败原因速查
          1. **仓库冲突 (FAIL_ON_PROJECT_REPOS)**
             表现之一：\`repository 'Google' was added by build file 'build.gradle.kts'\`
             → 根 android/build.gradle.kts 不允许再声明 \`allprojects { repositories {} }\`，
             因为 settings.gradle.kts 已声明 \`RepositoriesMode.FAIL_ON_PROJECT_REPOS\`。
             表现之二：\`repository 'maven' was added by plugin 'dev.flutter.flutter-gradle-plugin'\`
             → Flutter 官方插件在 apply 时会动态注入 maven 仓库，因此**不能使用
             FAIL_ON_PROJECT_REPOS**；必须改为
             \`repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)\`。
          1b. **AGP / Kotlin Gradle Plugin Marker 找不到（或 resolutionStrategy 报必须声明版本）**
              表现之一：\`Plugin [id: 'com.android.application', version: 'x.y.z', apply: false] was not found …
              could not resolve plugin artifact 'com.android.application.gradle.plugin:x.y.z'\`。
              原因之一：Google Maven 并非对每个 AGP 小版本都发布 plugin marker pom（用于 \`plugins {}\`
              语法的解析），但真实实现 jar \`com.android.tools.build:gradle:x.y.z\` 是存在的；
              在海外 CI 环境更容易触发 marker 解析 404。
              表现之二：\`AGP plugin 'com.android.application' must declare a version in settings plugins {}\`
              （出现在 configuring project ':app' 阶段，根 android/build.gradle.kts line:12
              \`evaluationDependsOn(":app")\` 附近）。
              原因之二：\`resolutionStrategy.eachPlugin {}\` 中直接
              \`error()\` 了 \`requested.version == null\` 情况——但 Flutter 的 includeBuild +
              \`evaluationDependsOn(":app")\` 会走一条**不带 version 信息**的 plugin apply 路径
              （正常 settings plugins {} 里的版本不会注入到这条合成路径），所以
              不能直接 error，必须给与 settings plugins {} 相同版本的硬编码兜底。
              解决：在 \`android/settings.gradle.kts\` 文件顶部声明版本常量
              （\`AGP_VERSION\`、\`KOTLIN_VERSION\`），
              然后在 \`pluginManagement { resolutionStrategy { eachPlugin { … } } }\` 里，把
              \`requested.version ?: error(...)\` 改成
              \`requested.version ?: AGP_VERSION\`，最后
              \`useModule("com.android.tools.build:gradle:<agp>")\` 和
              \`useModule("org.jetbrains.kotlin:kotlin-gradle-plugin:<kotlin>")\`。
              同时 \`plugins {}\` block 里也**复用同一份常量**，避免两份版本号漂移。
              当前组合：AGP 8.6.1 / Kotlin 2.0.20（Flutter stable 验证过的组合，marker 解析兼容性更好）。
          2. **JitPack 仓库不可达**  
             表现：\`Could not resolve com.github.HChenX:SuperLyricApi:3.4\`  
             → 查看上方 "Network probe" step；若 JitPack ❌，可在构建机上使用镜像 \`https://www.jitpack.io\`。
          3. **Gradle Wrapper 缺失 gradle-wrapper.jar**  
             表现：\`ClassNotFoundException: org.gradle.wrapper.GradleWrapperMain\`  
             → 本 workflow 使用 \`flutter build apk\`（而非裸 \`./gradlew\`），Flutter SDK 会
             在 CI 中自动生成完整 wrapper 三件套；若仍失败则需本地执行 \`flutter build apk\` 生成
             \`gradlew + gradlew.bat + gradle/wrapper/gradle-wrapper.jar\` 并提交到仓库。
          4. **签名信息不完整**  
             表现：KeyStore 文件无法打开 / \`Invalid keystore format\` → 检查 Secrets 编码与密码。

          ### 构建日志尾部（最近 30 行非空内容）
          \`\`\`
          $FAIL_HINT
          \`\`\`

          > 完整日志、Gradle reports 与输出目录已打包为 \`build-diagnostics-…\` artifact，
          > 可在 Artifacts 卡片下载后排查。
          EOF
